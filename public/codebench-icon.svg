<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- CodeBench mark: instrument bench glyph -->
  <rect x="4" y="4" width="56" height="56" rx="10" fill="#111310"/>
  <rect x="4" y="4" width="56" height="56" rx="10" fill="none" stroke="#f5a623" stroke-width="2.5"/>
  <!-- signal trace -->
  <polyline points="12,40 20,40 25,20 32,48 38,28 44,36 52,36" fill="none" stroke="#f5a623" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- probe dot -->
  <circle cx="52" cy="36" r="3.5" fill="#2fbf71"/>
  <circle cx="12" cy="40" r="3.5" fill="#f0576b"/>
  <!-- baseline ticks -->
  <line x1="12" y1="52" x2="52" y2="52" stroke="#3a3d36" stroke-width="2"/>
  <line x1="20" y1="49" x2="20" y2="55" stroke="#3a3d36" stroke-width="2"/>
  <line x1="32" y1="49" x2="32" y2="55" stroke="#3a3d36" stroke-width="2"/>
  <line x1="44" y1="49" x2="44" y2="55" stroke="#3a3d36" stroke-width="2"/>
</svg>
