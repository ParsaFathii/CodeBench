<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="ui-monospace, 'Cascadia Code', Menlo, monospace">
  <!-- CodeBench — system architecture (original diagram) -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f5a623"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#111310"/>
  <text x="24" y="36" fill="#f5a623" font-size="16" letter-spacing="3">CODEBENCH — SYSTEM ARCHITECTURE</text>
  <text x="24" y="54" fill="#8b8f85" font-size="10">single-route workbench SPA · REST API · serial coordinator · real OS-process engines</text>

  <!-- Web interface -->
  <rect x="40" y="80" width="280" height="120" rx="8" fill="#1a1d18" stroke="#f5a623" stroke-width="1.5"/>
  <text x="60" y="106" fill="#f5a623" font-size="12">WEB INTERFACE</text>
  <text x="60" y="126" fill="#c9cdc2" font-size="10">Next.js 16 · React 19 · TypeScript</text>
  <text x="60" y="142" fill="#8b8f85" font-size="10">10 views: Workbench · Catalog · Runner</text>
  <text x="60" y="158" fill="#8b8f85" font-size="10">Results · Compare · Regression · History</text>
  <text x="60" y="174" fill="#8b8f85" font-size="10">Environment · AI Insights · Settings</text>

  <!-- API -->
  <rect x="40" y="240" width="280" height="88" rx="8" fill="#1a1d18" stroke="#3a3d36" stroke-width="1.5"/>
  <text x="60" y="266" fill="#c9cdc2" font-size="12">REST API  /api/v1/*</text>
  <text x="60" y="286" fill="#8b8f85" font-size="10">experiments · runs · results · raw</text>
  <text x="60" y="302" fill="#8b8f85" font-size="10">comparisons · reports · ai · settings</text>

  <!-- Coordinator -->
  <rect x="40" y="380" width="280" height="130" rx="8" fill="#1a1d18" stroke="#f5a623" stroke-width="1.5"/>
  <text x="60" y="406" fill="#f5a623" font-size="12">EXPERIMENT COORDINATOR</text>
  <text x="60" y="426" fill="#c9cdc2" font-size="10">serial queue · one OS process per job</text>
  <text x="60" y="442" fill="#8b8f85" font-size="10">QUEUED→PREPARING→RUNNING→VERIFYING</text>
  <text x="60" y="458" fill="#8b8f85" font-size="10">→ANALYZING→COMPLETED / FAILED</text>
  <text x="60" y="476" fill="#8b8f85" font-size="10">real progress · cancellation · timeouts</text>
  <text x="60" y="494" fill="#8b8f85" font-size="10">stale-run repair</text>

  <!-- arrows web->api->coordinator -->
  <line x1="180" y1="200" x2="180" y2="238" stroke="#f5a623" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="180" y1="328" x2="180" y2="378" stroke="#f5a623" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="190" y="215" fill="#8b8f85" font-size="9">fetch / poll</text>
  <text x="190" y="355" fill="#8b8f85" font-size="9">background execution</text>

  <!-- Engines -->
  <rect x="420" y="80" width="240" height="120" rx="8" fill="#1a1d18" stroke="#f5a623" stroke-width="1.5"/>
  <text x="440" y="106" fill="#f5a623" font-size="12">C++ ENGINE</text>
  <text x="440" y="126" fill="#c9cdc2" font-size="10">g++ -std=c++20 -O2</text>
  <text x="440" y="142" fill="#8b8f85" font-size="10">Google Benchmark 1.9.4</text>
  <text x="440" y="158" fill="#8b8f85" font-size="10">repetitions → raw ns/op</text>
  <text x="440" y="174" fill="#8b8f85" font-size="10">DoNotOptimize sink</text>

  <rect x="420" y="240" width="240" height="120" rx="8" fill="#1a1d18" stroke="#f0576b" stroke-width="1.5"/>
  <text x="440" y="266" fill="#f0576b" font-size="12">JAVA ENGINE</text>
  <text x="440" y="286" fill="#c9cdc2" font-size="10">Temurin JDK 21 · javac -proc:full</text>
  <text x="440" y="302" fill="#8b8f85" font-size="10">JMH 1.37 · single fork</text>
  <text x="440" y="318" fill="#8b8f85" font-size="10">warm-up iters → rawData ns/op</text>
  <text x="440" y="334" fill="#8b8f85" font-size="10">gc profiler → B/op (labelled)</text>

  <rect x="420" y="400" width="240" height="120" rx="8" fill="#1a1d18" stroke="#2fbf71" stroke-width="1.5"/>
  <text x="440" y="426" fill="#2fbf71" font-size="12">PYTHON ENGINE</text>
  <text x="440" y="446" fill="#c9cdc2" font-size="10">CPython 3.12</text>
  <text x="440" y="462" fill="#8b8f85" font-size="10">pyperf 2.10 · worker process</text>
  <text x="440" y="478" fill="#8b8f85" font-size="10">values → raw ns/op</text>
  <text x="440" y="494" fill="#8b8f85" font-size="10">PYTHONHASHSEED=0</text>

  <!-- coordinator -> engines -->
  <path d="M 320 430 C 370 430 370 140 418 140" fill="none" stroke="#f5a623" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 320 445 C 370 445 370 300 418 300" fill="none" stroke="#f5a623" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 320 460 C 370 460 370 460 418 460" fill="none" stroke="#f5a623" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- shared contracts -->
  <rect x="720" y="80" width="230" height="200" rx="8" fill="#1a1d18" stroke="#3a3d36" stroke-width="1.5"/>
  <text x="740" y="106" fill="#c9cdc2" font-size="12">SHARED CONTRACTS</text>
  <text x="740" y="128" fill="#f5a623" font-size="10">SplitMix64 PRNG</text>
  <text x="740" y="142" fill="#8b8f85" font-size="9">bit-identical inputs per (dataset,n,seed)</text>
  <text x="740" y="164" fill="#f5a623" font-size="10">FNV-1a 64 checksums</text>
  <text x="740" y="178" fill="#8b8f85" font-size="9">input + output + fixed verify cases</text>
  <text x="740" y="200" fill="#f5a623" font-size="10">TypeScript reference</text>
  <text x="740" y="214" fill="#8b8f85" font-size="9">reference implementation of every variant</text>
  <text x="740" y="236" fill="#f5a623" font-size="10">Versioned schemas</text>
  <text x="740" y="250" fill="#8b8f85" font-size="9">workload v1.0 · result v1.0</text>

  <!-- storage -->
  <rect x="720" y="310" width="230" height="96" rx="8" fill="#1a1d18" stroke="#3a3d36" stroke-width="1.5"/>
  <text x="740" y="336" fill="#c9cdc2" font-size="12">SQLITE + PRISMA</text>
  <text x="740" y="356" fill="#8b8f85" font-size="10">experiments · runs · run logs</text>
  <text x="740" y="372" fill="#8b8f85" font-size="10">results + raw observations + stats</text>
  <text x="740" y="388" fill="#8b8f85" font-size="10">env snapshots · ai analyses · reports</text>

  <!-- AI -->
  <rect x="720" y="436" width="230" height="84" rx="8" fill="#1a1d18" stroke="#2fbf71" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="740" y="462" fill="#2fbf71" font-size="12">AI LAYER (optional)</text>
  <text x="740" y="480" fill="#8b8f85" font-size="10">z-ai SDK / Ollama / disabled</text>
  <text x="740" y="496" fill="#8b8f85" font-size="10">grounded · validated · read-only</text>

  <!-- engines -> storage -->
  <path d="M 660 140 C 700 140 700 340 718 350" fill="none" stroke="#3a3d36" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 660 300 C 690 300 690 355 718 358" fill="none" stroke="#3a3d36" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 660 460 C 700 460 700 380 718 368" fill="none" stroke="#3a3d36" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="424" y="222" fill="#8b8f85" font-size="9">engines → normalized results + raw harness output → storage</text>

  <!-- storage -> web -->
  <path d="M 718 400 C 640 540 300 540 180 502" fill="none" stroke="#3a3d36" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="360" y="540" fill="#8b8f85" font-size="9">results, statistics, comparisons (read path)</text>

  <text x="24" y="552" fill="#5c6057" font-size="9">CodeBench · Copyright © 2026 Parsa Fathi · Apache-2.0</text>
</svg>
