<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" font-family="ui-monospace, 'Cascadia Code', Menlo, monospace">
  <!-- CodeBench — benchmark execution & verification flow (original diagram) -->
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f5a623"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f0576b"/>
    </marker>
  </defs>
  <rect width="980" height="420" fill="#111310"/>
  <text x="24" y="34" fill="#f5a623" font-size="15" letter-spacing="3">BENCHMARK EXECUTION &amp; VERIFICATION FLOW</text>
  <text x="24" y="52" fill="#8b8f85" font-size="10">one job = one (variant, language, size) · verification happens BEFORE any timing counts</text>

  <!-- flow row 1 -->
  <rect x="30" y="80" width="170" height="64" rx="6" fill="#1a1d18" stroke="#3a3d36"/>
  <text x="46" y="104" fill="#c9cdc2" font-size="11">experiment config</text>
  <text x="46" y="122" fill="#8b8f85" font-size="9">variants · languages · sizes</text>
  <text x="46" y="136" fill="#8b8f85" font-size="9">dataset · seed · warmup · reps</text>

  <line x1="200" y1="112" x2="248" y2="112" stroke="#f5a623" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="250" y="80" width="150" height="64" rx="6" fill="#1a1d18" stroke="#3a3d36"/>
  <text x="264" y="104" fill="#c9cdc2" font-size="11">validate config</text>
  <text x="264" y="122" fill="#8b8f85" font-size="9">registry · datasets</text>
  <text x="264" y="136" fill="#8b8f85" font-size="9">max sizes · engine availability</text>

  <line x1="400" y1="112" x2="448" y2="112" stroke="#f5a623" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="450" y="80" width="160" height="64" rx="6" fill="#1a1d18" stroke="#f5a623"/>
  <text x="464" y="104" fill="#f5a623" font-size="11">prepare engines</text>
  <text x="464" y="122" fill="#8b8f85" font-size="9">compile C++ / Java</text>
  <text x="464" y="136" fill="#8b8f85" font-size="9">(cached by source mtime)</text>

  <line x1="610" y1="112" x2="658" y2="112" stroke="#f5a623" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="660" y="80" width="150" height="64" rx="6" fill="#1a1d18" stroke="#3a3d36"/>
  <text x="676" y="104" fill="#c9cdc2" font-size="11">spawn job process</text>
  <text x="676" y="122" fill="#8b8f85" font-size="9">detached process group</text>
  <text x="676" y="136" fill="#8b8f85" font-size="9">hard timeout kill</text>

  <line x1="810" y1="112" x2="858" y2="112" stroke="#f5a623" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="860" y="80" width="90" height="64" rx="6" fill="#1a1d18" stroke="#3a3d36"/>
  <text x="874" y="106" fill="#c9cdc2" font-size="11">next job</text>
  <text x="874" y="124" fill="#8b8f85" font-size="9">serially</text>

  <!-- inside one job -->
  <rect x="30" y="190" width="920" height="200" rx="8" fill="#15170f" stroke="#f5a623" stroke-dasharray="6 3"/>
  <text x="48" y="216" fill="#f5a623" font-size="12">INSIDE ONE JOB PROCESS</text>

  <rect x="50" y="235" width="200" height="56" rx="6" fill="#1a1d18" stroke="#2fbf71"/>
  <text x="62" y="257" fill="#2fbf71" font-size="10">① generate input (untimed)</text>
  <text x="62" y="273" fill="#8b8f85" font-size="9">SplitMix64(dataset, n, seed)</text>

  <line x1="250" y1="263" x2="288" y2="263" stroke="#f5a623" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="290" y="235" width="210" height="56" rx="6" fill="#1a1d18" stroke="#2fbf71"/>
  <text x="302" y="257" fill="#2fbf71" font-size="10">② verify (untimed)</text>
  <text x="302" y="273" fill="#8b8f85" font-size="9">one op on real input + fixed cases</text>
  <text x="302" y="285" fill="#8b8f85" font-size="9">FNV-1a 64 sidecar</text>

  <line x1="500" y1="263" x2="538" y2="263" stroke="#f5a623" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="540" y="235" width="190" height="56" rx="6" fill="#1a1d18" stroke="#f5a623"/>
  <text x="552" y="257" fill="#f5a623" font-size="10">③ explicit warm-up</text>
  <text x="552" y="273" fill="#8b8f85" font-size="9">harness-specific semantics</text>

  <line x1="730" y1="263" x2="768" y2="263" stroke="#f5a623" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="770" y="235" width="160" height="56" rx="6" fill="#1a1d18" stroke="#f5a623"/>
  <text x="782" y="257" fill="#f5a623" font-size="10">④ harness measures</text>
  <text x="782" y="273" fill="#8b8f85" font-size="9">R repetitions → raw ns/op</text>

  <!-- verification gate -->
  <rect x="50" y="310" width="430" height="64" rx="6" fill="#1a1d18" stroke="#f0576b"/>
  <text x="64" y="332" fill="#f0576b" font-size="10">⑤ verification gate (after all jobs)</text>
  <text x="64" y="348" fill="#8b8f85" font-size="9">engine cases == TypeScript reference (per variant)</text>
  <text x="64" y="362" fill="#8b8f85" font-size="9">input/output checksums equal across languages</text>

  <rect x="510" y="310" width="420" height="64" rx="6" fill="#1a1d18" stroke="#3a3d36"/>
  <text x="524" y="332" fill="#c9cdc2" font-size="10">⑥ statistics from raw observations</text>
  <text x="524" y="348" fill="#8b8f85" font-size="9">median · mean ± σ · percentiles · CV · 95% t-CI · IQR outliers (retained)</text>
  <text x="524" y="362" fill="#8b8f85" font-size="9">stability classes · cross-language groups · warnings</text>

  <path d="M 850 291 L 850 310" fill="none" stroke="#f0576b" stroke-width="1.5" marker-end="url(#arrR)"/>
  <path d="M 480 342 L 508 342" fill="none" stroke="#f5a623" stroke-width="1.5" marker-end="url(#arr2)"/>

  <text x="24" y="408" fill="#5c6057" font-size="9">a failed gate marks results FAILED — never ranked, never averaged into valid comparisons · CodeBench © 2026 Parsa Fathi</text>
</svg>
